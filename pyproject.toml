[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servicenow-mcp-python"
version = "1.0.0"
description = "Python MCP server for ServiceNow — ITSM, CMDB, HRSD, CSM and more."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/servicenow_mcp"]

[project.scripts]
servicenow-mcp = "servicenow_mcp.server:main"
