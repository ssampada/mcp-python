# Nginx reverse proxy for ServiceNow MCP Server
# Provides HTTPS termination (required for production OAuth/SAML).
#
# Setup:
#   1. Install nginx:      sudo apt install nginx   (or sudo dnf install nginx)
#   2. Get SSL cert:       sudo certbot --nginx -d mcp.yourcompany.com
#   3. Copy this config:   sudo cp scripts/nginx.conf /etc/nginx/sites-available/servicenow-mcp
#   4. Enable:             sudo ln -s /etc/nginx/sites-available/servicenow-mcp /etc/nginx/sites-enabled/
#   5. Reload:             sudo nginx -t && sudo systemctl reload nginx
#
# Then update .env:
#   - OAuth redirect URL becomes: https://mcp.yourcompany.com/oauth/callback
# And GitHub Copilot config:
#   - URL becomes: https://mcp.yourcompany.com/mcp

server {
    listen 443 ssl http2;
    server_name mcp.yourcompany.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.yourcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.yourcompany.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming support
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name mcp.yourcompany.com;
    return 301 https://$host$request_uri;
}
